; Xdebug установлен, но выключен: включается переменной XDEBUG_MODE
; (например, XDEBUG_MODE=debug или XDEBUG_MODE=coverage в .env).
xdebug.mode = off
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
xdebug.log_level = 0
