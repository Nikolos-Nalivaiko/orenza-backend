; Базовые настройки PHP для приложения (общие для dev и production).
memory_limit = 512M
max_execution_time = 120
post_max_size = 32M
upload_max_filesize = 32M
max_file_uploads = 20

expose_php = Off
date.timezone = UTC

log_errors = On
error_log = /proc/self/fd/2
display_errors = Off

realpath_cache_size = 4096K
realpath_cache_ttl = 600
